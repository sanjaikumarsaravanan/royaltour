<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Luxury Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Inner Crest Shield -->
  <path d="M256 96 C336 96 376 112 376 112 C376 256 320 348 256 392 C192 348 136 256 136 112 C136 112 176 96 256 96 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)" />

  <!-- Royal Crown Icon Inside Crest -->
  <g transform="translate(186, 150) scale(0.55)" fill="url(#goldGrad)">
    <!-- Crown Base -->
    <path d="M40 220 L216 220 L200 240 L56 240 Z" />
    <path d="M30 190 L226 190 L216 215 L40 215 Z" />
    <!-- Crown Peaks -->
    <polygon points="30,190 60,80 100,150 128,40 156,150 196,80 226,190" />
    <!-- Jewels on Peaks -->
    <circle cx="60" cy="70" r="14" />
    <circle cx="128" cy="30" r="18" />
    <circle cx="196" cy="70" r="14" />
  </g>

  <!-- RT Monogram -->
  <text x="256" y="325" 
        font-family="'Cinzel', 'Times New Roman', serif" 
        font-size="68" 
        font-weight="bold" 
        letter-spacing="4"
        fill="url(#goldGrad)" 
        text-anchor="middle">RT</text>

  <!-- Wordmark Subtitle -->
  <text x="256" y="445" 
        font-family="'Poppins', sans-serif" 
        font-size="24" 
        font-weight="700" 
        letter-spacing="6"
        fill="#f8fafc" 
        text-anchor="middle">ROYAL TOURS</text>
</svg>
